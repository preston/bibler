server {
    listen      80;
    root /usr/share/nginx/html;
    index          index.html;
    # PDF.js uses an ES module worker, which browsers require to have a JavaScript MIME type.
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }
    try_files $uri /index.html;
}
